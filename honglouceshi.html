<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大观园·入梦测试</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', serif;
            background: #0a0a0f;
            color: #c4b8a8;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* 背景粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(196, 184, 168, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* 开始页 */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            margin-bottom: 10px;
            color: #d4c4b0;
            text-shadow: 0 0 30px rgba(212, 196, 176, 0.2);
        }
        
        .subtitle {
            font-size: 0.9rem;
            color: #8a7e72;
            letter-spacing: 0.3em;
            margin-bottom: 40px;
        }
        
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #8a7e72, transparent);
            margin: 30px auto;
        }
        
        .preview-box {
            background: rgba(20, 20, 28, 0.8);
            border: 1px solid rgba(138, 126, 114, 0.2);
            padding: 25px;
            margin: 30px 0;
            text-align: left;
            position: relative;
        }
        
        .preview-box::before {
            content: '◆';
            position: absolute;
            top: -8px;
            left: 20px;
            color: #8a7e72;
            font-size: 0.8rem;
        }
        
        .preview-title {
            font-size: 0.85rem;
            color: #8a7e72;
            margin-bottom: 15px;
            letter-spacing: 0.2em;
        }
        
        .preview-list {
            list-style: none;
            font-size: 0.9rem;
            line-height: 2.2;
        }
        
        .preview-list li {
            padding-left: 20px;
            position: relative;
        }
        
        .preview-list li::before {
            content: '·';
            position: absolute;
            left: 0;
            color: #6a5e52;
        }
        
        .start-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 50px;
            border: 1px solid rgba(212, 196, 176, 0.4);
            background: transparent;
            color: #d4c4b0;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .start-btn:hover {
            background: rgba(212, 196, 176, 0.08);
            border-color: rgba(212, 196, 176, 0.7);
            box-shadow: 0 0 40px rgba(212, 196, 176, 0.1);
        }
        
        .warning-text {
            font-size: 0.75rem;
            color: #5a4e42;
            margin-top: 30px;
            letter-spacing: 0.1em;
        }
        
        /* 答题页 */
        .quiz-screen {
            display: none;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .progress-bar {
            width: 100%;
            height: 1px;
            background: rgba(138, 126, 114, 0.15);
            margin-bottom: 40px;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a7e72, #d4c4b0);
            transition: width 1s ease;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 5px;
            height: 5px;
            background: #d4c4b0;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 196, 176, 0.5);
        }
        
        .question-number {
            font-size: 0.75rem;
            color: #5a4e42;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }
        
        .question-text {
            font-size: 1.15rem;
            line-height: 2;
            margin-bottom: 35px;
            font-weight: 300;
            min-height: 80px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .option {
            padding: 18px 22px;
            border: 1px solid rgba(138, 126, 114, 0.15);
            background: rgba(20, 20, 28, 0.5);
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 0.95rem;
            line-height: 1.7;
            position: relative;
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            background: rgba(138, 126, 114, 0.08);
            transition: width 0.4s ease;
        }
        
        .option:hover {
            border-color: rgba(138, 126, 114, 0.4);
            padding-left: 28px;
        }
        
        .option:hover::before {
            width: 100%;
        }
        
        /* 休息页 */
        .rest-screen {
            display: none;
            text-align: center;
            padding: 80px 20px;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
        }
        
        .rest-icon {
            font-size: 2rem;
            margin-bottom: 30px;
            opacity: 0.5;
        }
        
        .rest-text {
            font-size: 1.1rem;
            line-height: 2.2;
            max-width: 450px;
            margin: 0 auto;
            font-weight: 300;
        }
        
        .rest-author {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5a4e42;
        }
        
        .continue-btn {
            margin-top: 50px;
            padding: 12px 40px;
            border: 1px solid rgba(138, 126, 114, 0.3);
            background: transparent;
            color: #8a7e72;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        
        .continue-btn:hover {
            border-color: rgba(212, 196, 176, 0.5);
            color: #d4c4b0;
        }
        
        /* 结果页 */
        .result-screen {
            display: none;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .result-card {
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(138, 126, 114, 0.15);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        
        .result-card::before,
        .result-card::after {
            content: '◆';
            position: absolute;
            color: #5a4e42;
            font-size: 0.7rem;
        }
        
        .result-card::before {
            top: 15px;
            left: 15px;
        }
        
        .result-card::after {
            bottom: 15px;
            right: 15px;
        }
        
        .result-label {
            font-size: 0.75rem;
            color: #5a4e42;
            letter-spacing: 0.3em;
            margin-bottom: 15px;
        }
        
        .result-name {
            font-size: 2rem;
            color: #d4c4b0;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }
        
        .result-title {
            font-size: 0.85rem;
            color: #8a7e72;
            margin-bottom: 30px;
        }
        
        .result-quote {
            font-style: italic;
            font-size: 1rem;
            line-height: 2;
            color: #a09888;
            padding: 20px;
            border-left: 1px solid rgba(138, 126, 114, 0.2);
            border-right: 1px solid rgba(138, 126, 114, 0.2);
            margin: 25px 0;
        }
        
        .result-desc {
            text-align: left;
            font-size: 0.9rem;
            line-height: 2.2;
            color: #a09888;
            margin-top: 25px;
        }
        
        .result-desc p {
            margin-bottom: 15px;
            text-indent: 2em;
        }
        
        .affinity-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(138, 126, 114, 0.1);
        }
        
        .affinity-title {
            font-size: 0.75rem;
            color: #5a4e42;
            letter-spacing: 0.2em;
            margin-bottom: 15px;
        }
        
        .affinity-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .affinity-tag {
            padding: 6px 16px;
            border: 1px solid rgba(138, 126, 114, 0.2);
            font-size: 0.8rem;
            color: #8a7e72;
        }
        
        .restart-btn {
            margin-top: 40px;
            padding: 14px 45px;
            border: 1px solid rgba(212, 196, 176, 0.3);
            background: transparent;
            color: #d4c4b0;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        
        .restart-btn:hover {
            background: rgba(212, 196, 176, 0.05);
            border-color: rgba(212, 196, 176, 0.6);
        }
        
        /* 微恐元素 */
        .flicker {
            animation: flicker 4s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
            52% { opacity: 0.3; }
            54% { opacity: 0.9; }
            56% { opacity: 0.5; }
            58% { opacity: 1; }
        }
        
        .fade-in {
            animation: fadeIn 1.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 打字机效果 */
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(40, end);
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .title { font-size: 1.8rem; letter-spacing: 0.3em; }
            .question-text { font-size: 1rem; }
            .option { padding: 15px 18px; font-size: 0.9rem; }
            .result-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 开始页 -->
    <div class="start-screen" id="startScreen">
        <div class="container">
            <h1 class="title flicker">大观园</h1>
            <p class="subtitle">入 梦 测 试</p>
            <div class="divider"></div>
            <p style="font-size: 0.9rem; color: #8a7e72; line-height: 2; margin-bottom: 20px;">
                你走进一座荒废的园子。<br>
                石板路上长满青苔，海棠花却开得正好。<br>
                有人在远处唤你，声音像从水里传来。
            </p>
            
            <div class="preview-box fade-in">
                <p class="preview-title">本测试将涉及</p>
                <ul class="preview-list">
                    <li>你对「失去」的反应模式</li>
                    <li>你处理亲密关系的隐性逻辑</li>
                    <li>你面对规则时的本能姿态</li>
                    <li>你独处时与什么为伴</li>
                    <li>你表达需求的迂回程度</li>
                    <li>你对「干净」的执念来源</li>
                    <li>你愤怒时的冷却方式</li>
                    <li>你做梦的频率与内容倾向</li>
                </ul>
            </div>
            
            <p style="font-size: 0.85rem; color: #6a5e52; line-height: 1.8; margin-top: 20px;">
                共 24 题 · 预计 6 分钟<br>
                途中设有歇息处
            </p>
            
            <button class="start-btn" onclick="startQuiz()">入 梦</button>
            
            <p class="warning-text">
                测试结果仅供观览，不可作为任何诊断依据<br>
                所有人物解读基于原著文本，拒绝阴谋论
            </p>
        </div>
    </div>

    <!-- 答题页 -->
    <div class="quiz-screen" id="quizScreen">
        <div class="container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <p class="question-number" id="questionNumber">壹 / 廿四</p>
            <p class="question-text" id="questionText"></p>
            <div class="options" id="optionsContainer"></div>
        </div>
    </div>

    <!-- 休息页 -->
    <div class="rest-screen" id="restScreen">
        <div class="container">
            <div class="rest-icon">❦</div>
            <p class="rest-text" id="restText"></p>
            <p class="rest-author" id="restAuthor"></p>
            <button class="continue-btn" onclick="continueQuiz()">继续走</button>
        </div>
    </div>

    <!-- 结果页 -->
    <div class="result-screen" id="resultScreen">
        <div class="container">
            <div class="result-card" id="resultCard">
                <p class="result-label">你的判词</p>
                <h2 class="result-name" id="resultName"></h2>
                <p class="result-title" id="resultTitle"></p>
                <p class="result-quote" id="resultQuote"></p>
                <div class="result-desc" id="resultDesc"></div>
                <div class="affinity-section">
                    <p class="affinity-title">与你有渊源的</p>
                    <div class="affinity-tags" id="affinityTags"></div>
                </div>
                <button class="restart-btn" onclick="restartQuiz()">重返入园处</button>
            </div>
        </div>
    </div>

    <script>
        // 生成背景粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // 题目数据
        const questions = [
            {
                text: "你收到一份礼物，包装精美，但里面是你已经有的东西。你会？",
                options: [
                    { text: "笑着收下，心想对方至少记得我喜欢这个", scores: { lin: 2, bao: 1, chai: 0, dai: 1 } },
                    { text: "直接说「我已经有了」，然后看对方反应", scores: { lin: 0, bao: 0, chai: 2, dai: 0 } },
                    { text: "收下后转送给更需要的人", scores: { lin: 0, bao: 2, chai: 1, dai: 0 } },
                    { text: "盯着礼物发呆，想起上一次收到它时的自己", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } }
                ]
            },
            {
                text: "深夜睡不着，你通常？",
                options: [
                    { text: "起来写点什么，不管有没有人看", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } },
                    { text: "整理房间，把东西摆成对称的样子", scores: { lin: 0, bao: 1, chai: 3, dai: 0 } },
                    { text: "找还醒着的人聊天，说什么都行", scores: { lin: 0, bao: 3, chai: 0, dai: 1 } },
                    { text: "躺着听雨，直到意识模糊", scores: { lin: 2, bao: 0, chai: 0, dai: 3 } }
                ]
            },
            {
                text: "朋友突然疏远你，没有解释。你的第一反应？",
                options: [
                    { text: "反复回想最后一次见面的细节", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } },
                    { text: "直接去问「我做错了什么」", scores: { lin: 0, bao: 2, chai: 0, dai: 1 } },
                    { text: "等对方自己想通，我不急", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "先疏远回去，保护自己", scores: { lin: 1, bao: 0, chai: 0, dai: 3 } }
                ]
            },
            {
                text: "你最喜欢哪种花？",
                options: [
                    { text: "芙蓉——开得张扬，谢得也快", scores: { lin: 3, bao: 1, chai: 0, dai: 0 } },
                    { text: "牡丹——大家都说好，确实好", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "海棠——红得好看，还能吃", scores: { lin: 0, bao: 3, chai: 0, dai: 1 } },
                    { text: "柳絮——其实不算花，但飞起来好看", scores: { lin: 1, bao: 0, chai: 0, dai: 3 } }
                ]
            },
            {
                text: "一群人聚会，你通常？",
                options: [
                    { text: "讲笑话让气氛热起来", scores: { lin: 0, bao: 3, chai: 0, dai: 0 } },
                    { text: "观察谁没说话，去陪那个人", scores: { lin: 0, bao: 1, chai: 2, dai: 1 } },
                    { text: "找个角落待着，等有人来找我", scores: { lin: 2, bao: 0, chai: 0, dai: 3 } },
                    { text: "提前想好什么时候可以走", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } }
                ]
            },
            {
                text: "你生气的时候，别人通常？",
                options: [
                    { text: "看不出来，我擅长掩饰", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "会惊讶，因为我平时不这样", scores: { lin: 1, bao: 0, chai: 0, dai: 2 } },
                    { text: "立刻知道，我藏不住", scores: { lin: 2, bao: 3, chai: 0, dai: 1 } },
                    { text: "以为我在开玩笑", scores: { lin: 0, bao: 2, chai: 0, dai: 0 } }
                ]
            },
            {
                text: "如果必须选一种超能力？",
                options: [
                    { text: "读心术——但我可能不想知道", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } },
                    { text: "让所有人暂时忘记烦恼", scores: { lin: 0, bao: 3, chai: 1, dai: 0 } },
                    { text: "把事情安排得井井有条", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "在梦里见到想见的人", scores: { lin: 2, bao: 0, chai: 0, dai: 3 } }
                ]
            },
            {
                text: "你对「家」的理解最接近？",
                options: [
                    { text: "一个可以关上门哭的地方", scores: { lin: 2, bao: 0, chai: 0, dai: 3 } },
                    { text: "有人等你吃饭的地方", scores: { lin: 0, bao: 3, chai: 0, dai: 1 } },
                    { text: "需要维护运转的系统", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "一个概念，我到处流浪", scores: { lin: 3, bao: 1, chai: 0, dai: 2 } }
                ]
            },
            // 休息点1
            {
                text: "你路过一个池塘，水面平静。你？",
                options: [
                    { text: "扔颗石子看涟漪", scores: { lin: 0, bao: 3, chai: 0, dai: 1 } },
                    { text: "看自己的倒影，整理头发", scores: { lin: 2, bao: 0, chai: 1, dai: 2 } },
                    { text: "想水里有没有鱼", scores: { lin: 0, bao: 1, chai: 0, dai: 3 } },
                    { text: "绕开走，怕掉下去", scores: { lin: 1, bao: 0, chai: 3, dai: 0 } }
                ]
            },
            {
                text: "别人说你「想太多」，你？",
                options: [
                    { text: "承认，但改不了", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } },
                    { text: "反驳，是他们想太少", scores: { lin: 2, bao: 1, chai: 0, dai: 1 } },
                    { text: "笑笑，不解释", scores: { lin: 0, bao: 0, chai: 3, dai: 0 } },
                    { text: "问「你想太少的时候在想什么」", scores: { lin: 1, bao: 2, chai: 0, dai: 0 } }
                ]
            },
            {
                text: "你最喜欢的天气？",
                options: [
                    { text: "暴雨——世界被洗过一遍", scores: { lin: 2, bao: 0, chai: 0, dai: 3 } },
                    { text: "晴天——可以出门", scores: { lin: 0, bao: 3, chai: 0, dai: 0 } },
                    { text: "阴天——不用防晒，光线柔和", scores: { lin: 1, bao: 0, chai: 2, dai: 1 } },
                    { text: "下雪——安静，且会掩盖痕迹", scores: { lin: 3, bao: 0, chai: 0, dai: 2 } }
                ]
            },
            {
                text: "你更倾向于记住？",
                options: [
                    { text: "别人对你的好，怕忘记", scores: { lin: 2, bao: 1, chai: 0, dai: 1 } },

                <p>你有责任感，有牺牲精神，但你很少问自己「我想要什么」。你的选择往往是「应该」而非「愿意」，这让你可靠，也让你遥远。</p>

                desc: `<p>你的温和不是软弱，是一种对冲突的生理性排斥。你的身体比你的意识更早做出「算了」的决定。</p>

                <p>原著中的惜春是四春中最小的，却最早看破。她画大观园、撵入画、最终出家——她的决绝不是无情，是太早就学会了不依赖。她的悲剧在于，一个小孩不该这么清醒。</p>

            qiaojie: {

                <p>原著中的巧姐是凤姐之女，贾府败落后被刘姥姥所救，最终嫁给板儿成为农妇。她是十二钗中结局「最好」的——如果「好」意味着活着。她的故事告诉我们，有时候降维也是一种生存。</p>

                <p>你有耐心，有恒心，有长期主义的能力。你不追求即时反馈，你的满足来自「完成」而非「被看见」。但你也渴望被看见，只是不再期待。</p>
                <p>原著中的李纨是贾珠遗孀，青春守寡，把所有希望寄托在儿子贾兰身上。她的大观园诗社是全书最温暖的片段之一——一个被礼教冻结的人，仍在寻找表达的方式。她的「槁木死灰」是表演，不是真相。</p>
                <p>你的课题：你的克制是美德，但也是牢笼。偶尔让深处的温度上来一点，不会烧毁什么。</p>`,
                affinity: ["贾兰", "林黛玉", "薛宝钗", "平儿"]
            },
            keqing: {
                name: "秦可卿",
                title: "情天情海 · 情既相逢必主淫",

                desc: `<p>你的吸引力是天生的，也是负担。你不需要做什么，就会被人投射各种欲望和想象。</p>
                <p>你有洞察力，能看穿别人的伪装，但你看不穿自己的。你在关系里往往是「被需要」的角色，却很少有机会说「我需要」。</p>
                <p>原著中的可卿是《红楼梦》最大的谜团。她的奢华、她的病、她的死亡——文本被删改，真相不可考。但她房里的陈设、她托梦凤姐的远见，证明她不是一个简单的「淫」字可以概括的。她是一个被欲望包围，却仍有清醒时刻的人。</p>
                <p>你的课题：你的魅力是资源，也是消耗。学会把它收回来，用在自己身上。</p>`,
                affinity: ["王熙凤", "贾宝玉", "贾珍", "尤氏"]
            },
            sheyue: {
                name: "麝月",
                title: "开到荼蘼花事了",
                quote: "「枉与他人作笑谈」",
                desc: `<p>你是一个「最后留下的人」——不是最突出的，却是最持久的。你的存在感很低，但你的缺席会被注意到。</p>
                <p>你不追求独特，你追求「合适」。你知道什么时候该说话，什么时候该沉默，这种分寸感让你在任何环境里都能存活。</p>
                <p>原著中的麝月是怡红院的大丫鬟之一，晴雯被逐、袭人出嫁后，她陪宝玉到了最后。她不像晴雯耀眼，不像袭人周全，但她是「开到荼蘼花事了」的那个人——最后一个见证者。</p>
                <p>你的课题：你的持久是优点，但不必一直做最后离开的人。偶尔先走，也是一种权利。</p>`,
                affinity: ["贾宝玉", "袭人", "晴雯", "秋纹"]
            },
            zijuan: {
                name: "紫鹃",
                title: "慧紫鹃 · 情辞试莽玉",
                quote: "「杜鹃无语正黄昏」",
                desc: `<p>你的忠诚不是盲目的，是经过观察后的选择。你一旦认定，就会比对方更投入、更着急、更不计后果。</p>
                <p>你有洞察力，有行动力，有「为了对方好」而冒险的勇气。你的关心往往是行动先于语言，甚至先于对方的请求。</p>
                <p>原著中的紫鹃是黛玉的丫鬟，也是全书最懂黛玉的人。她试宝玉的那一段， risking everything for her mistress's happiness——她不是奴才，她是战友。黛玉死后，她的结局未明，但我们可以想象那种空洞。</p>
                <p>你的课题：你的投入是礼物，但要确认对方想要。有时候「为了你好」需要先问「你想要什么」。</p>`,
                affinity: ["林黛玉", "贾宝玉", "雪雁", "贾母"]
            },
            liulaolao: {
                name: "刘姥姥",
                title: "母蝗虫 · 醉卧怡红院",
                quote: "「老刘老刘，食量大似牛」",
                desc: `<p>你的生存智慧被低估太久了。你知道什么时候该装傻，什么时候该认真，这种切换是你的超能力。</p>
                <p>你有感恩之心，有行动力，有「不要脸」的勇气——不是真的不要脸，是知道什么比脸更重要。你的幽默是武器，也是盾牌。</p>
                <p>原著中的刘姥姥是《红楼梦》最被低估的角色。她二进荣国府的喜剧表演、救巧姐的义举、与凤姐的最后对话——她是一个在底层摸爬滚打却保持了完整人性的人。她的「粗俗」里有大智慧，她的「卑微」里有真尊严。</p>
                <p>你的课题：你的适应力让你活下来，但不必一直适应。有时候坚持不妥协，也是一种选择。</p>`,
                affinity: ["王熙凤", "巧姐", "贾母", "板儿"]
            }
        };

        // 扩展分数映射（简化版，实际根据选项分配）
        const charKeys = ['lin', 'bao', 'chai', 'dai', 'xiangyun', 'qingwen', 'xiren', 'tan', 'xi', 'ping', 'xiangling', 'yuanchun', 'yingchun', 'xichun', 'qiaojie', 'liwan', 'keqing', 'sheyue', 'zijuan', 'liulaolao'];

        let currentQuestion = 0;
        let scores = {};
        charKeys.forEach(k => scores[k] = 0);

        function startQuiz() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            const numMap = ['壹','贰','叁','肆','伍','陆','柒','捌','玖','拾','拾壹','拾贰','拾叁','拾肆','拾伍','拾陆','拾柒','拾捌','拾玖','廿','廿壹','廿贰','廿叁','廿肆'];
            document.getElementById('questionNumber').textContent = `${numMap[currentQuestion]} / 廿四`;
            
            document.getElementById('questionText').textContent = q.text;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt.text;
                div.onclick = () => selectOption(opt.scores);
                container.appendChild(div);
            });
        }

        function selectOption(scoresAdd) {
            // 添加分数
            for (let key in scoresAdd) {
                if (scores[key] !== undefined) {
                    scores[key] += scoresAdd[key];
                }
            }
            
            currentQuestion++;
            
            // 检查是否需要休息
            if (currentQuestion === 8 || currentQuestion === 16) {
                showRest();
                return;
            }
            
            if (currentQuestion >= questions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function showRest() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('restScreen').style.display = 'flex';
            
            const restIdx = currentQuestion === 8 ? 0 : (currentQuestion === 16 ? 1 : 2);
            const rest = restPoints[restIdx];
            document.getElementById('restText').textContent = rest.text;
            document.getElementById('restAuthor').textContent = rest.author;
        }

        function continueQuiz() {
            document.getElementById('restScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            if (currentQuestion >= questions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function showResult() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            
            // 根据分数计算结果（简化算法）
            // 实际应该根据所有答题综合计算，这里用基础分+随机扰动模拟
            let maxScore = -1;
            let resultKey = 'lin';
            
            // 基于前面的答题，找到最高分
            for (let key in scores) {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    resultKey = key;
                }
            }
            
            // 如果分数太接近，根据一些题目做微调（简化处理）
            const char = characters[resultKey];
            
            document.getElementById('resultName').textContent = char.name;
            document.getElementById('resultTitle').textContent = char.title;
            document.getElementById('resultQuote').textContent = char.quote;
            document.getElementById('resultDesc').innerHTML = char.desc;
            
            const tagsContainer = document.getElementById('affinityTags');
            tagsContainer.innerHTML = '';
            char.affinity.forEach(name => {
                const tag = document.createElement('span');
                tag.className = 'affinity-tag';
                tag.textContent = name;
                tagsContainer.appendChild(tag);
            });
        }

        function restartQuiz() {
            currentQuestion = 0;
            charKeys.forEach(k => scores[k] = 0);
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
        }
    </script>
